[project]
name = "agentsec-sdk"
version = "0.1.0"
description = "AI Agent Security Monitoring SDK"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "traceloop-sdk>=0.22",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    "pydantic>=2.0",
    "aiohttp>=3.9",
    "prometheus-client>=0.18",
    "httpx>=0.25",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
