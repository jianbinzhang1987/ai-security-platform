<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>安全大盘</title>
  <link rel="stylesheet" href="../../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    .dashboard-container {
      padding: 20px;
      background-color: #f0f2f5;
      min-height: calc(100vh - 40px);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      margin-left: -10px;
      margin-right: -10px;
      margin-bottom: 20px;
    }
    .col {
      padding-left: 10px;
      padding-right: 10px;
      box-sizing: border-box;
    }
    .col-3 { width: 25%; }
    .col-6 { width: 50%; }
    .col-12 { width: 100%; }

    .panel {
      background: #fff;
      border-radius: 4px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,21,41,.08);
      height: 100%;
      box-sizing: border-box;
    }
    .panel-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    .stat-number {
      font-size: 28px;
      font-weight: bold;
      color: #1890ff;
      line-height: 1.2;
    }
    .stat-desc {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
    }
    .chart-box {
      width: 100%;
      height: 300px;
    }
    .chart-box-large {
      width: 100%;
      height: 400px;
    }
  </style>
</head>
<body class="page-content">
  <div class="dashboard-container">

    <!-- 顶部数据概览 -->
    <div class="row">
      <div class="col col-3">
        <div class="panel">
          <div class="panel-title">接入应用总数</div>
          <div class="stat-number">1,204</div>
          <div class="stat-desc">较昨日新增 <span style="color: #52c41a;">+12</span></div>
        </div>
      </div>
      <div class="col col-3">
        <div class="panel">
          <div class="panel-title">活跃智能体数</div>
          <div class="stat-number">8,530</div>
          <div class="stat-desc">较昨日新增 <span style="color: #52c41a;">+345</span></div>
        </div>
      </div>
      <div class="col col-3">
        <div class="panel">
          <div class="panel-title">今日拦截请求</div>
          <div class="stat-number" style="color: #f5222d;">45,912</div>
          <div class="stat-desc">拦截率 <span style="color: #f5222d;">2.4%</span></div>
        </div>
      </div>
      <div class="col col-3">
        <div class="panel">
          <div class="panel-title">触发策略告警</div>
          <div class="stat-number" style="color: #fa8c16;">3,210</div>
          <div class="stat-desc">未处理 <span style="color: #fa8c16;">128</span></div>
        </div>
      </div>
    </div>

    <!-- 中间图表区 -->
    <div class="row">
      <div class="col col-6">
        <div class="panel">
          <div class="panel-title">近三十日请求与拦截趋势</div>
          <div id="trendChart" class="chart-box"></div>
        </div>
      </div>
      <div class="col col-6">
        <div class="panel">
          <div class="panel-title">安全风险类型分布</div>
          <div id="riskPieChart" class="chart-box"></div>
        </div>
      </div>
    </div>

    <!-- 底部图表区 -->
    <div class="row">
      <div class="col col-12">
        <div class="panel">
          <div class="panel-title">全国节点访问热力图</div>
          <div id="mapChart" class="chart-box-large"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // 初始化请求与拦截趋势图
    var trendChart = echarts.init(document.getElementById('trendChart'));
    var trendOption = {
      tooltip: {
        trigger: 'axis'
      },
      legend: {
        data: ['总访问量', '拦截量']
      },
      grid: {
        left: '3%',
        right: '4%',
        bottom: '3%',
        containLabel: true
      },
      xAxis: {
        type: 'category',
        boundaryGap: false,
        data: ['1日', '5日', '10日', '15日', '20日', '25日', '30日']
      },
      yAxis: {
        type: 'value'
      },
      series: [
        {
          name: '总访问量',
          type: 'line',
          smooth: true,
          itemStyle: { color: '#1890ff' },
          data: [12000, 13200, 10100, 13400, 9000, 23000, 21000]
        },
        {
          name: '拦截量',
          type: 'line',
          smooth: true,
          itemStyle: { color: '#f5222d' },
          data: [220, 182, 191, 234, 290, 330, 310]
        }
      ]
    };
    trendChart.setOption(trendOption);

    // 初始化安全风险类型分布图
    var riskPieChart = echarts.init(document.getElementById('riskPieChart'));
    var riskPieOption = {
      tooltip: {
        trigger: 'item'
      },
      legend: {
        orient: 'vertical',
        left: 'left'
      },
      series: [
        {
          name: '风险类型',
          type: 'pie',
          radius: '50%',
          data: [
            { value: 1048, name: '越权访问' },
            { value: 735, name: '敏感信息泄露' },
            { value: 580, name: '恶意提示词' },
            { value: 484, name: '接口滥用' },
            { value: 300, name: '模型幻觉异常' }
          ],
          emphasis: {
            itemStyle: {
              shadowBlur: 10,
              shadowOffsetX: 0,
              shadowColor: 'rgba(0, 0, 0, 0.5)'
            }
          }
        }
      ]
    };
    riskPieChart.setOption(riskPieOption);

    // 初始化地图（占位使用柱状图代替复杂地图配置）
    var mapChart = echarts.init(document.getElementById('mapChart'));
    var mapOption = {
      tooltip: {
        trigger: 'axis',
        axisPointer: {
          type: 'shadow'
        }
      },
      grid: {
        left: '3%',
        right: '4%',
        bottom: '3%',
        containLabel: true
      },
      xAxis: {
        type: 'value',
        boundaryGap: [0, 0.01]
      },
      yAxis: {
        type: 'category',
        data: ['北京节点', '上海节点', '广州节点', '深圳节点', '杭州节点', '成都节点']
      },
      series: [
        {
          name: '访问量',
          type: 'bar',
          data: [18203, 23489, 29034, 104970, 131744, 630230],
          itemStyle: { color: '#722ed1' }
        }
      ]
    };
    mapChart.setOption(mapOption);

    // 监听窗口大小变化
    window.addEventListener('resize', function() {
      trendChart.resize();
      riskPieChart.resize();
      mapChart.resize();
    });
  </script>
</body>
</html>
